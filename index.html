<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給coco玩</title>
    <style>
        :root {
            --accent: #00f2ff;
            --accent-secondary: #7000ff;
            --bg-dark: #050505;
            --card-bg: #111111;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent), var(--accent-secondary));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.3;
        }

        h1 {
            text-align: center;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .box {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #222;
            background: #000;
            color: var(--accent);
            font-size: 16px;
            font-family: 'Consolas', monospace;
            resize: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        #resultOutput {
            color: var(--accent-secondary);
            background: #0a0a0a;
            cursor: default;
        }

        .mode-indicator {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin-top: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cipher X</h1>
    
    <div class="box">
        <label>Input</label>
        <textarea id="userInput" rows="4" placeholder=":)"></textarea>
    </div>

    <div class="box">
        <label>Output</label>
        <textarea id="resultOutput" rows="4" readonly></textarea>
    </div>

    <div id="modeLabel" class="mode-indicator">酷東西</div>
</div>

<script>
    class UltraEncryptor {
        constructor() {
            this.symbols = "ღ•⁂€™↑→↓⇝√∞░▲▶◀●☀☁☂☃☄★☆☉☐☑☚☛☜☝☞☟☠☢☣☪☮☯☸☹☺☻☼☽☾♔♕♖♗♘♚♛♜♝♞♟♡♨♩♪♫♬✈✉";
            this.stdB64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            this.toCustomMap = {};
            this.toStdMap = {};
            for (let i = 0; i < 64; i++) {
                this.toCustomMap[this.stdB64[i]] = this.symbols[i];
                this.toStdMap[this.symbols[i]] = this.stdB64[i];
            }
        }

        encrypt(text) {
            try {
                let b64 = btoa(unescape(encodeURIComponent(text))).replace(/=/g, '');
                return b64.split('').map(char => this.toCustomMap[char] || char).join('');
            } catch (e) { return "ERROR"; }
        }

        decrypt(encodedText) {
            try {
                let stdB64 = encodedText.split('').map(char => this.toStdMap[char] || char).join('');
                while (stdB64.length % 4 !== 0) { stdB64 += '='; }
                return decodeURIComponent(escape(atob(stdB64)));
            } catch (e) { return "INVALID SYMBOLS"; }
        }

        isEncrypted(text) {
            if (!text) return false;
            const chars = [...text];
            const matchCount = chars.filter(c => this.symbols.includes(c)).length;
            return matchCount > 0 && matchCount >= text.length * 0.5;
        }
    }

    const cipher = new UltraEncryptor();
    const inputArea = document.getElementById('userInput');
    const outputArea = document.getElementById('resultOutput');
    const modeLabel = document.getElementById('modeLabel');

    inputArea.addEventListener('input', () => {
        const val = inputArea.value.trim();
        if (!val) {
            outputArea.value = "";
            modeLabel.innerText = "SYSTEM READY";
            return;
        }

        if (cipher.isEncrypted(val)) {
            modeLabel.innerText = "DECRYPTING MODE";
            outputArea.value = cipher.decrypt(val);
        } else {
            modeLabel.innerText = "ENCRYPTING MODE";
            outputArea.value = cipher.encrypt(val);
        }
    });
</script>

</body>
</html>
