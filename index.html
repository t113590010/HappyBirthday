<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給coco玩</title>
    <style>
        :root {
            --accent: #00f2ff;
            --accent-secondary: #7000ff;
            --bg-dark: #050505;
            --card-bg: #111111;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--accent), var(--accent-secondary));
            border-radius: 26px;
            z-index: -1;
            opacity: 0.3;
        }

        h1 {
            text-align: center;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .box {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 8px;
            margin-left: 4px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #222;
            background: #000;
            color: var(--accent);
            font-size: 16px;
            font-family: 'Consolas', monospace;
            resize: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        #resultOutput {
            color: var(--accent-secondary);
            background: #0a0a0a;
            cursor: default;
        }

        .mode-indicator {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin-top: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>神奇酷東西</h1>
    
    <div class="box">
        <label>Input</label>
        <textarea id="userInput" rows="4" placeholder=":)"></textarea>
    </div>

    <div class="box">
        <label>Output</label>
        <textarea id="resultOutput" rows="4" readonly></textarea>
    </div>

    <div id="modeLabel" class="mode-indicator">酷東西</div>
</div>

<script>
    class UltraEncryptor {
        constructor() {
            this.symbols = "ღ•⁂€™↑→↓⇝√∞░▲▶◀●☀☁☂☃☄★☆☉☐☑☚☛☜☝☞☟☠☢☣☪☮☯☸☹☺☻☼☽☾♔♕♖♗♘♚♛♜♝♞♟♡♨♩♪♫♬✈✉";
            this.stdB64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            this.toCustomMap = {};
            this.toStdMap = {};
            const symArray = [...this.symbols];
            [...this.stdB64].forEach((char, i) => {
                this.toCustomMap[char] = symArray[i];
                this.toStdMap[symArray[i]] = char;
            });
        }

        encrypt(text) {
            try {
                const utf8Bytes = new TextEncoder().encode(text);
                let binary = "";
                utf8Bytes.forEach(b => binary += String.fromCharCode(b));
                const b64 = btoa(binary).replace(/=/g, '');
                return [...b64].map(char => this.toCustomMap[char] || char).join('');
            } catch (e) { return "Encryption Error"; }
        }

        decrypt(text) {
            try {
                let stdB64 = [...text].map(char => this.toStdMap[char] || "").join('');
                while (stdB64.length % 4 !== 0) { stdB64 += '='; }
                const binary = atob(stdB64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return new TextDecoder().decode(bytes);
            } catch (e) { return null; }
        }

        isAllSymbols(text) {
            if (!text) return false;
            const symArray = [...this.symbols];
            return [...text].every(char => symArray.includes(char));
        }
    }

    const cipher = new UltraEncryptor();
    const input = document.getElementById('userInput');
    const output = document.getElementById('resultOutput');
    const mode = document.getElementById('modeLabel');

    input.addEventListener('input', () => {
        const val = input.value.trim();
        if (!val) {
            output.value = "";
            mode.innerText = "READY";
            return;
        }

        if (cipher.isAllSymbols(val)) {
            const decoded = cipher.decrypt(val);
            if (decoded) {
                mode.innerText = "解密結果:";
                output.value = decoded;
                output.style.color = "#00ff44";
            } else {
                mode.innerText = "加密結果:";
                output.value = cipher.encrypt(val);
                output.style.color = "var(--accent)";
            }
        } else {
            mode.innerText = "加密結果:";
            output.value = cipher.encrypt(val);
            output.style.color = "var(--accent)";
        }
    });
</script>

</body>
</html>
